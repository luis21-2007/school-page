<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Napoleon-School</title>
    <link href="assets/css/bootstrap.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1">
    <nav class="navbar navbar-expand-lg bg-dark shadow-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-white " href="#">
                <img src="assets/img/napoleon-logo.jpg" class="img-fluid rounded-circle "  alt="La Napo"
                     style="width:50px;height:50px;margin-right: 20px">
                Napoleon School
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item "><a class="nav-link fw-bold text-white" href="index.html">Inicio</a></li>
                </ul>

            </div>
        </div>

    </nav>
    <section class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-center mb-4 text-secondary">Contáctanos</h2>

            <form action="#" method="POST">

                <div class="mb-3">
                    <label for="nombreContacto" class="form-label font-weight-bold">Nombre Completo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i>👤</span>
                        <input type="text" class="form-control" id="nombreContacto" placeholder="Ej. Juan Pérez" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="emailContacto" class="form-label">Correo Electrónico</label>
                    <div class="input-group">
                        <input type="email" class="form-control" id="emailContacto" placeholder="tu-correo" required>
                        <span class="input-group-text" id="addon-email">@example.com</span>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="asuntoContacto" class="form-label">¿En qué nivel estás interesado?</label>
                    <select class="form-select" id="asuntoContacto" required>
                        <option value="" selected disabled>Selecciona una opción...</option>
                        <option value="secundaria">Secundaria</option>
                        <option value="preparatoria">Preparatoria</option>
                        <option value="universidad">Universidad</option>

                    </select>
                </div>

                <div class="mb-4">
                    <label for="mensajeContacto" class="form-label">Mensaje o Comentarios</label>
                    <textarea class="form-control" id="mensajeContacto" rows="4" placeholder="Escribe aquí tus dudas o comentarios..." required></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-secondary btn-lg">Enviar Mensaje</button>
                </div>

            </form>
        </div>
    </section>
</main>
<footer class="bg-dark text-white text-center py-4">
    <div class="container">
        <p class="mb-0">&copy; 2026 Napoleon School. Todos los derechos reservados. Desde 1995 formando los mejores estudiantes</p>
    </div>
</footer>
<script src="assets/js/bootstrap.js"></script>
</body>
</html>
